  <body>
    <div id="root"></div>
    <script>
      (function () {
        var ID = "wireflow-embed";
        function inject() {
          if (document.getElementById(ID)) return true;
          var target = document.getElementById("components");
          if (!target || !target.parentNode) return false;
          var sec = document.createElement("section");
          sec.id = ID;
          sec.style.cssText = "padding:64px 0;border-top:1px solid #e5e5ea;background:#fff";
          sec.innerHTML =
            '<div style="width:min(1140px,calc(100% - 32px));margin:0 auto">' +
            '<p style="margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.08em;color:#6e6e73">WIREFLOW</p>' +
            '<h2 style="margin:0 0 8px;font-size:26px;color:#1d1d1f">포트폴리오 제작 과정 · 화면 흐름</h2>' +
            '<p style="margin:0 0 20px;color:#6e6e73">wireflow-review 스킬로 메인 → 프로젝트 → 상세 흐름을 검토한 결과입니다.</p>' +
            '<iframe src="design/portfolio-redesign.html" title="포트폴리오 메인·상세 와이어플로" loading="lazy" style="width:100%;height:720px;border:1px solid #e5e5ea;border-radius:12px;background:#fff"></iframe>' +
            '<p style="margin:8px 0 0;font-size:13px"><a href="design/portfolio-redesign.html" target="_blank" rel="noopener" style="color:#1d1d1f">새 탭에서 열기 ↗</a></p>' +
            "</div>";
          target.parentNode.insertBefore(sec, target);
          return true;
        }
        if (inject()) return;
        var mo = new MutationObserver(function () { if (inject()) mo.disconnect(); });
        mo.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
