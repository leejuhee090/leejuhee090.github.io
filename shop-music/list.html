<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전체상품 | SAMPLE SHOP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/shop.css" />
</head>
<body>
  <div class="topbar"><div class="wrap"><a href="#">로그인</a><a href="#">회원가입</a><a href="cart.html">장바구니</a><a href="#">주문조회</a></div></div>
  <header class="header"><div class="wrap">
    <a class="logo" href="index.html">SAMPLE SHOP</a>
    <nav class="gnb"><a href="index.html">홈</a><a class="on" href="list.html">전체상품</a><a href="list.html?cat=cat1">카테고리 1</a><a href="list.html?cat=cat2">카테고리 2</a><a href="list.html?cat=cat3">카테고리 3</a></nav>
    <div class="util"><button class="search-open" id="search-open" type="button" aria-label="상품 검색"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button><a class="cart-link" href="cart.html">장바구니 <span class="cart-count">0</span></a></div>
  </div></header>

  <main class="wrap">
    <div class="page-title"><h1>전체상품</h1><p>카테고리별로 상품을 골라보세요.</p></div>
    <div class="tabs" id="cat-tabs"></div>
    <div class="toolbar">
      <span id="count"></span>
      <select id="sort" aria-label="정렬">
        <option value="best">인기순</option>
        <option value="low">낮은 가격순</option>
        <option value="high">높은 가격순</option>
      </select>
    </div>
    <ul class="grid" id="product-list"></ul>
  </main>

  <footer><div class="wrap">
    <p><b>SAMPLE SHOP</b></p>
    <p>바로 적용 가능한 Cafe24 쇼핑몰 샘플</p>
  </div></footer>
  <div class="popup-dim search-dim" id="search-modal" hidden>
    <div class="search-pop" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <div class="search-top"><h3 id="search-title">상품 검색</h3><button id="search-close" type="button" aria-label="닫기">&times;</button></div>
      <input type="search" id="search-input" placeholder="상품명을 입력하세요" aria-label="상품 검색어" autocomplete="off" />
      <p class="search-count" id="search-count"></p>
      <ul class="search-results" id="search-list"></ul>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
