<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직접 만든 셀렉트·캘린더 데모</title>
<link rel="stylesheet" href="admin/css/reset.css">
<link rel="stylesheet" href="admin/css/common.css">
<style>
  html, body { margin: 0; background: #fff; }
  #PC { padding: 16px; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .demo-cap { font-size: 12px; color: #666; margin: 0 0 6px; }
  /* 데모에서는 세 캘린더를 펼친 상태로 보여 줌 (클릭 동작은 그대로) */
  #PC .datepicker .dtDropdown { position: static !important; display: block !important; width: 280px; margin-top: 6px; }
  #PC .datepicker, #PC .datepicker.size-m, #PC .datepicker.size-b { display: block; height: auto !important; min-height: 0 !important; position: relative; }
  #PC .datepicker .datepicker-input { position: relative; }
</style>
</head>
<body>
<div id="PC">
  <div class="demo-row">
    <div>
      <p class="demo-cap">셀렉트</p>
      <div class="custom-select-box" role="combobox" aria-haspopup="listbox" aria-expanded="false" tabindex="0" aria-labelledby="demo-sel-label" style="width:220px">
        <label id="demo-sel-label" class="visually-hidden">선택</label>
        <div class="selected-option" role="textbox" aria-readonly="true"><span>선택1</span></div>
        <ul class="options-list" role="listbox">
          <li role="option" data-value="선택1" tabindex="-1">선택1</li>
          <li role="option" data-value="선택2" tabindex="-1">선택2</li>
          <li role="option" data-value="선택3" tabindex="-1">선택3</li>
          <li role="option" data-value="선택4" tabindex="-1">선택4</li>
          <li role="option" data-value="선택5" tabindex="-1">선택5</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="demo-row" style="margin-top:16px">
    <div>
      <p class="demo-cap">캘린더 32px</p>
      <div class="datepicker open dp" style="width:280px">
        <input type="text" class="datepicker-input" placeholder="YYYY-MM-DD" readonly/>
        <div class="dtDropdown">
          <div class="datepicker-header">
            <div class="arrow-btn-area">
              <button class="arrow-btn year-prev" title="이전 연도">이전 연도</button>
              <button class="arrow-btn mon-prev" title="이전 월">이전 월</button>
            </div>
            <div class="cd-custom-select-area">
              <div class="cd-custom-select yearSel" tabindex="0"><div class="selected"></div><div class="options"></div></div>
              <div class="cd-custom-select monSel" tabindex="0"><div class="selected"></div><div class="options"></div></div>
            </div>
            <div class="arrow-btn-area">
              <button class="arrow-btn mon-next" title="다음 월">다음 월</button>
              <button class="arrow-btn year-next" title="다음 연도">연도</button>
            </div>
          </div>
          <div class="datepicker-grid">
            <div class="day-label">일</div><div class="day-label">월</div><div class="day-label">화</div>
            <div class="day-label">수</div><div class="day-label">목</div><div class="day-label">금</div>
            <div class="day-label">토</div>
            <div class="days-container"></div>
          </div>
          <div class="datepicker-footer">
            <button class="today-button">Today</button>
            <span class="today-date"></span>
          </div>
        </div>
      </div>
    </div>
    <div>
      <p class="demo-cap">캘린더 40px</p>
      <div class="datepicker open dp size-m" style="width:280px">
        <input type="text" class="datepicker-input" placeholder="YYYY-MM-DD" readonly/>
        <div class="dtDropdown">
          <div class="datepicker-header">
            <div class="arrow-btn-area">
              <button class="arrow-btn year-prev" title="이전 연도">이전 연도</button>
              <button class="arrow-btn mon-prev" title="이전 월">이전 월</button>
            </div>
            <div class="cd-custom-select-area">
              <div class="cd-custom-select yearSel" tabindex="0"><div class="selected"></div><div class="options"></div></div>
              <div class="cd-custom-select monSel" tabindex="0"><div class="selected"></div><div class="options"></div></div>
            </div>
            <div class="arrow-btn-area">
              <button class="arrow-btn mon-next" title="다음 월">다음 월</button>
              <button class="arrow-btn year-next" title="다음 연도">연도</button>
            </div>
          </div>
          <div class="datepicker-grid">
            <div class="day-label">일</div><div class="day-label">월</div><div class="day-label">화</div>
            <div class="day-label">수</div><div class="day-label">목</div><div class="day-label">금</div>
            <div class="day-label">토</div>
            <div class="days-container"></div>
          </div>
          <div class="datepicker-footer">
            <button class="today-button">Today</button>
            <span class="today-date"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="demo-row" style="margin-top:16px">
    <div>
      <p class="demo-cap">캘린더 48px</p>
      <div class="datepicker open dp size-b" style="width:280px">
        <input type="text" class="datepicker-input" placeholder="YYYY-MM-DD" readonly/>
        <div class="dtDropdown">
          <div class="datepicker-header">
            <div class="arrow-btn-area"><button class="arrow-btn year-prev" title="이전 연도">이전 연도</button><button class="arrow-btn mon-prev" title="이전 월">이전 월</button></div>
            <div class="cd-custom-select-area">
              <div class="cd-custom-select yearSel" tabindex="0"><div class="selected"></div><div class="options"></div></div>
              <div class="cd-custom-select monSel" tabindex="0"><div class="selected"></div><div class="options"></div></div>
            </div>
            <div class="arrow-btn-area"><button class="arrow-btn mon-next" title="다음 월">다음 월</button><button class="arrow-btn year-next" title="다음 연도">연도</button></div>
          </div>
          <div class="datepicker-grid">
            <div class="day-label">일</div><div class="day-label">월</div><div class="day-label">화</div>
            <div class="day-label">수</div><div class="day-label">목</div><div class="day-label">금</div>
            <div class="day-label">토</div>
            <div class="days-container"></div>
          </div>
          <div class="datepicker-footer"><button class="today-button">Today</button><span class="today-date"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="admin/js/ui.js"></script>
</body>
</html>
