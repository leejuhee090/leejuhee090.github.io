<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <title>이주희 포트폴리오</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css" />
    <script type="module" crossorigin src="/assets/index--7r9BG-m.js?v=2"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-aMY5Hxq3.css?v=2">
    <style>
      button[aria-label="화면 테마 전환"] > span[aria-hidden="true"] {
        position: relative; display: inline-block; width: 38px; height: 21px; border-radius: 999px;
        background: #c7c7cc; vertical-align: middle; flex: 0 0 auto;
      }
      button[aria-label="화면 테마 전환"] > span[aria-hidden="true"]::after {
        content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%;
        background: #ffffff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.15s ease;
      }
      html.dark button[aria-label="화면 테마 전환"] > span[aria-hidden="true"] { background: #39393d; }
      button[aria-label="화면 테마 전환"] > span:first-child { color: var(--color-text-primary); font-weight: 600; }
      button[aria-label="화면 테마 전환"] > b { color: var(--color-text-tertiary, #8e8e93); font-weight: 400; }
      button[aria-label="화면 테마 전환"] > span[aria-hidden="true"]::after { transform: translateX(17px); }
      html.dark button[aria-label="화면 테마 전환"] > span[aria-hidden="true"]::after { transform: translateX(0); }
    </style>
      <style id="light-theme-vibrant">
      /* 라이트 테마: 전달받은 'Vibrant' 디자인 색상 (보라/검정 그라데이션 제거) */
      :root:not(.dark) {
        --color-brand: #0c1a0c;
        --color-brand-accent: #c3cf6b;
        --color-brand-tint: rgba(12, 26, 12, 0.08);
        --color-brand-subtle: rgba(12, 26, 12, 0.06);
        --color-chart-3: #a9c46a;
        --color-surface-page: #fbfcf7;
        --color-surface-card: #ffffff;
        --color-surface-muted: #eef2e6;
        --color-surface-raised: #ffffff;
        --color-surface-sunken: #eef2e6;
        --color-surface-stage: #f6f8ef;
        --color-text-primary: #0c1a0c;
        --color-text-secondary: #3f4f3c;
        --color-text-tertiary: #6b7a68;
        --color-border-default: rgba(12, 26, 12, 0.18);
        --color-blob-brand: rgba(195, 207, 107, 0.45);
        --color-blob-violet: rgba(195, 207, 107, 0.35);
      }
      html:not(.dark) body {
        background: #fbfcf7 radial-gradient(90% 60% at 100% 35%, rgba(230, 226, 150, 0.55), transparent 70%),
                    radial-gradient(70% 55% at 0% 85%, rgba(160, 230, 215, 0.45), transparent 70%);
        color: #0c1a0c;
      }
      html:not(.dark) .bg-hero-title,
      html:not(.dark) [class*="bg-hero-title"] {
        background-image: none !important;
        color: #0c1a0c !important;
        -webkit-text-fill-color: #0c1a0c;
      }
      html:not(.dark) .bg-blob-brand,
      html:not(.dark) .bg-blob-violet,
      html:not(.dark) .bg-stage-brand,
      html:not(.dark) .bg-stage-violet {
        background-image: radial-gradient(60% 60% at 50% 50%, rgba(195, 207, 107, 0.4), transparent 70%) !important;
      }
      html:not(.dark) button[role="switch"][aria-checked="true"],
      html:not(.dark) [aria-checked="true"].bg-brand {
        background-image: none !important;
        background-color: #0c1a0c !important;
      }
      html:not(.dark) [class*="bg-[linear-gradient"] {
        background-image: linear-gradient(135deg, #c3cf6b, #a9c46a) !important;
      }
      html:not(.dark) .max-\[640px\]\:bg-ios-wallpaper {
        background-image: radial-gradient(60% 40% at 15% 0%, rgba(160, 230, 215, 0.45), transparent 70%),
                          radial-gradient(55% 45% at 95% 35%, rgba(230, 226, 150, 0.55), transparent 70%) !important;
      }
    </style>
      <style id="dark-theme-byewind">
      /* 다크 테마: 눈부심을 줄이고 WCAG 대비(본문 4.5:1 이상)를 맞춘 색 */
      html.dark {
        --color-brand: #8fb8d6;
        --color-brand-accent: #6f9ec0;
        --color-brand-tint: rgba(143, 184, 214, 0.14);
        --color-brand-subtle: rgba(143, 184, 214, 0.1);
        --color-chart-1: #5f8fb8;
        --color-chart-2: #7aa6c9;
        --color-chart-3: #6f9ec0;
        --color-surface-page: #1c1c1e;
        --color-surface-card: #26262a;
        --color-surface-muted: #2c2c31;
        --color-surface-raised: #2c2c31;
        --color-surface-sunken: #202023;
        --color-surface-stage: #222225;
        --color-text-primary: #e9e9ee;
        --color-text-secondary: #b4b4bd;
        --color-text-tertiary: #9a9aa3;
        --color-border-default: rgba(255, 255, 255, 0.12);
        --color-text-on-brand: #111418;
        --color-blob-brand: transparent;
        --color-blob-violet: transparent;
      }
      html.dark body {
        background: #1c1c1e;
        background-image: none;
        color: #e9e9ee;
      }
      html.dark .bg-hero-title,
      html.dark [class*="bg-hero-title"] {
        background-image: none !important;
        color: #e9e9ee !important;
        -webkit-text-fill-color: #e9e9ee;
      }
      html.dark .bg-blob-brand,
      html.dark .bg-blob-violet,
      html.dark .bg-stage-brand,
      html.dark .bg-stage-violet {
        background-image: none !important;
      }
      html.dark [aria-checked="true"].bg-brand,
      html.dark button[role="switch"][aria-checked="true"] {
        background-image: none !important;
        background-color: var(--color-brand) !important;
      }
      html.dark [class*="bg-[linear-gradient"] {
        background-image: none !important;
        background-color: var(--color-brand) !important;
        color: var(--color-text-on-brand);
      }
      html.dark .max-\[640px\]\:bg-ios-wallpaper {
        background-image: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var ID = "wireflow-embed";
        // 홈 화면에서만 보이도록 한다 (#/project/... 상세 화면에서는 숨김)
        function onHome() {
          return !/^#\/project\//.test(window.location.hash);
        }
        function sync() {
          var el = document.getElementById(ID);
          if (el) el.style.display = onHome() ? "" : "none";
        }
        function inject() {
          var target = document.getElementById("components");
          if (!target || !target.parentNode) return;
          if (document.getElementById(ID)) return;
          var sec = document.createElement("section");
          sec.id = ID;
          sec.style.cssText = "padding:48px 0;background:#fff";
          sec.innerHTML =
            '<div style="width:min(1140px,calc(100% - 32px));margin:0 auto">' +
            '<iframe src="design/portfolio-redesign.html" title="포트폴리오 메인·상세 와이어플로" loading="lazy" style="width:100%;height:720px;border:1px solid #e5e5ea;border-radius:12px;background:#fff"></iframe>' +
            "</div>";
          target.parentNode.insertBefore(sec, target);
        }
        function update() {
          inject();
          sync();
        }
        update();
        window.addEventListener("hashchange", update);
        var mo = new MutationObserver(update);
        mo.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
