    <script>
      (function () {
        document.documentElement.classList.add("js");
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        function mark() {
          var sections = document.querySelectorAll("#root section");
          sections.forEach(function (sec, i) {
            if (sec.hasAttribute("data-reveal")) return;
            sec.setAttribute("data-reveal", "");
            sec.setAttribute("data-delay", String(Math.min(i % 3, 3)));
          });
          if (!("IntersectionObserver" in window)) {
            document.querySelectorAll("[data-reveal]").forEach(function (el) { el.classList.add("is-in"); });
            return;
          }
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
            });
          }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
          document.querySelectorAll("[data-reveal]:not(.is-in)").forEach(function (el) { io.observe(el); });
        }
        var t = setInterval(function () {
          if (document.querySelector("#root section")) { clearInterval(t); mark(); }
        }, 120);
        setTimeout(function () { clearInterval(t); }, 8000);
      })();
    </script>

              row.innerHTML = EXTRA[key].map(function (l) { return '<span class="wk-lib-chip">' + l + '</span>'; }).join('');
              // 기존 태그 줄 바로 뒤에 붙인다
              var chips = a.querySelectorAll('[class*="rounded-full"]');
              var last = chips.length ? chips[chips.length - 1] : null;
              var host = last ? (last.parentElement || a) : a;
              host.appendChild(row);
            });
          });
          return true;
        }
        var t = setInterval(function () { if (apply()) clearInterval(t); }, 300);
        setTimeout(function () { clearInterval(t); }, 12000);
      })();
    </script>
    <style id="code-reveal">
      /* 코드 패널: 한 줄씩 나타나며, 위로 되돌아가기 전까지 그대로 유지 */
      .wk-code-line { opacity: 0; transform: translateX(-8px); transition: opacity 320ms ease, transform 320ms ease; }
      .wk-code-line.is-on { opacity: 1; transform: none; }
      @media (prefers-reduced-motion: reduce) { .wk-code-line { opacity: 1; transform: none; transition: none; } }
    </style>
    <script>
      (function () {
        var timers = [];
        var resets = [];
        var lastY = window.scrollY;
        window.addEventListener('scroll', function () {
          var y = window.scrollY;
          if (y < lastY - 2) resets.forEach(function (r) { r(); }); // 휠을 위로 올리면 다시 숨긴다
          lastY = y;
        }, { passive: true });
        function setup(box) {
          if (box.dataset.codeReveal) return;
          var lines = Array.prototype.slice.call(box.children);
          if (lines.length < 2) return;
          box.dataset.codeReveal = '1';
          lines.forEach(function (l) { l.classList.add('wk-code-line'); });
          function clearTimers() { timers.forEach(clearTimeout); timers = []; }
          function play() {
            clearTimers();
            lines.forEach(function (l, i) {
              timers.push(setTimeout(function () { l.classList.add('is-on'); }, i * 130));
            });
          }
          function reset() {
            clearTimers();
            lines.forEach(function (l) { l.classList.remove('is-on'); });
          }
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
              var top = en.boundingClientRect.top;
              if (en.isIntersecting && top < window.innerHeight * 0.85 && top > -en.boundingClientRect.height && !box.dataset.played) { box.dataset.played = '1'; play(); }
              else if (top > window.innerHeight) { box.dataset.played = ''; reset(); }
            });
          }, { threshold: [0, 0.3] });
          io.observe(box);
          resets.push(reset);
        }
        function scan() {
          var boxes = document.querySelectorAll('div');
          var found = false;
          Array.prototype.forEach.call(boxes, function (d) {
            if (d.className && typeof d.className === 'string' && d.className.indexOf('overflow-x-auto') >= 0 && d.className.indexOf('leading-[2]') >= 0) {
              setup(d); found = true;
            }
          });
          return found;
        }
        var t = setInterval(function () { if (scan()) clearInterval(t); }, 300);
        setTimeout(function () { clearInterval(t); }, 12000);
      })();
    </script>
    <script>
      (function () {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var targets = [];
        function collect() {
          var career = document.getElementById('career');
          if (!career) return false;
          var cards = Array.prototype.filter.call(career.querySelectorAll('[class*="border-border"]'), function (e) {
            return e.querySelector('svg') || e.querySelector('[style*="width"]');
          });
          // 가장 바깥 차트 카드만 (안쪽 중복 제외)
          targets = cards.filter(function (e) { return !cards.some(function (o) { return o !== e && o.contains(e); }); });
          return targets.length > 0;
        }
        var ticking = false;
        function update() {
          ticking = false;
          var career = document.getElementById('career');
          if (!career || !targets.length) return;
          var r = career.getBoundingClientRect();
          var vh = window.innerHeight;
          // 섹션이 화면 아래에서 위로 지나가는 동안 0 → 1
          var p = (vh - r.top) / (vh + r.height);
          p = Math.max(0, Math.min(1, p));
          var y = (0.5 - p) * 70;
          targets.forEach(function (t) {
            t.style.transition = 'none';
            t.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)';
          });
        }
        function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        var t = setInterval(function () { if (collect()) { clearInterval(t); update(); } }, 300);
        setTimeout(function () { clearInterval(t); }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var ID = "wireflow-embed";
        // 홈 화면에서만 보이도록 한다 (#/project/... 상세 화면에서는 숨김)
        function onHome() {
          return !/^#\/project\//.test(window.location.hash);
        }
        function sync() {
          var el = document.getElementById(ID);
          if (el) el.style.display = onHome() ? "" : "none";
        }
        function inject() {
          var target = document.getElementById("components");
          if (!target || !target.parentNode) return;
          if (document.getElementById(ID)) return;
          var sec = document.createElement("section");
          sec.id = ID;
          sec.style.cssText = "padding:48px 0;background:#fff";
          sec.innerHTML =
            '<div style="width:min(1140px,calc(100% - 32px));margin:0 auto">' +
            '<iframe src="design/portfolio-redesign.html" title="포트폴리오 메인·상세 와이어플로" loading="lazy" style="width:100%;height:720px;border:1px solid #e5e5ea;border-radius:12px;background:#fff"></iframe>' +
            "</div>";
          target.parentNode.insertBefore(sec, target);
        }
        function update() {
          inject();
          sync();
        }
        update();
        window.addEventListener("hashchange", update);
        var mo = new MutationObserver(update);
        mo.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
