<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카테고리 상품 | SAMPLE STORE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/store.css" />
</head>
<body>
  <div class="topbar"><div class="wrap"><a href="#">로그인</a><a href="#">고객센터</a><a href="cart.html">장바구니</a><a href="#">주문/배송</a></div></div>
  <header class="header store-header"><div class="wrap">
    <a class="logo" href="index.html">SAMPLE STORE</a>
    <div class="util"><button class="search-open" id="search-open" type="button" aria-label="상품 검색"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>&nbsp;상품 검색</button>
      <a class="cart-link" href="cart.html">장바구니 <span class="cart-count">0</span></a></div>
  </div>
  <div class="wrap store-info">
    <div class="store-avatar" aria-hidden="true">S</div>
    <div><p class="store-name">SAMPLE STORE</p><p class="store-meta">단골 고객 관심 등록 · 찜 상품 · 빠른 배송</p></div>
  </div>
  <nav class="wrap store-menu">
    <a href="index.html">홈</a><a class="on" href="list.html">베스트</a><a href="list.html">신상품</a><a href="list.html?cat=cat1">카테고리 1</a><a href="list.html?cat=cat2">카테고리 2</a><a href="list.html?cat=cat3">카테고리 3</a>
  </nav>
  </header>
  <main class="wrap">
    <div class="page-title"><h1>카테고리 상품</h1><p>원하는 상품을 카테고리와 정렬로 찾아보세요.</p></div>
    <div class="tabs" id="cat-tabs"></div>
    <div class="toolbar">
      <span id="count"></span>
      <select id="sort" aria-label="정렬">
        <option value="best">인기순</option>
        <option value="low">낮은 가격순</option>
        <option value="high">높은 가격순</option>
      </select>
    </div>
    <ul class="grid" id="product-list"></ul>
  </main>
  <footer><div class="wrap">
    <p><b>SAMPLE STORE</b></p>
    <p>고객센터 · 교환/반품 안내 · 이용약관 · 개인정보처리방침</p>
    <p>바로 적용 가능한 스마트스토어 구조 샘플</p>
  </div></footer>
  <div class="popup-dim search-dim" id="search-modal" hidden>
    <div class="search-pop" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <div class="search-top"><h3 id="search-title">상품 검색</h3><button id="search-close" type="button" aria-label="닫기">&times;</button></div>
      <input type="search" id="search-input" placeholder="상품명을 입력하세요" aria-label="상품 검색어" autocomplete="off" />
      <p class="search-count" id="search-count"></p>
      <ul class="search-results" id="search-list"></ul>
    </div>
  </div>
  <div class="popup-dim" id="popup" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="pop-title">
      <p class="pop-tag">NOTICE</p>
      <h3 id="pop-title">신상품 입고 안내</h3>
      <p>새로 입고된 상품을 만나보세요.</p>
      <div class="pop-actions">
        <label><input type="checkbox" id="pop-hide" /> 오늘 하루 보지 않기</label>
        <button id="pop-close" type="button">닫기</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>

</html>
