      html { scroll-behavior: smooth; }
      html.js [data-reveal] { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
      html.js [data-reveal].is-in { opacity: 1; transform: none; }

    <script>
      (function () {
        document.documentElement.classList.add("js");
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        function mark() {
          var sections = document.querySelectorAll("#root section");
          sections.forEach(function (sec, i) {
            if (sec.hasAttribute("data-reveal")) return;
            sec.setAttribute("data-reveal", "");
            sec.setAttribute("data-delay", String(Math.min(i % 3, 3)));
          });
          if (!("IntersectionObserver" in window)) {
            document.querySelectorAll("[data-reveal]").forEach(function (el) { el.classList.add("is-in"); });
            return;
          }
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); }
            });
          }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
          document.querySelectorAll("[data-reveal]:not(.is-in)").forEach(function (el) { io.observe(el); });
        }
        var t = setInterval(function () {
          if (document.querySelector("#root section")) { clearInterval(t); mark(); }
        }, 120);
        setTimeout(function () { clearInterval(t); }, 8000);
      })();
    </script>

      .wk-carousel-btn--prev { left: 4px; }
      .wk-carousel-btn--next { right: 4px; }
      .wk-dots { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
      .wk-dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.28); cursor: pointer; }
      .wk-dots button[aria-current="true"] { background: #ffffff; }
      @media (max-width: 640px) {
        .wk-carousel-btn { width: 34px; height: 34px; }
      }
    </style>
    <script>
      (function () {
        var POS = [
          { x: 0,    s: 1,    o: 1,    z: 3 },
          { x: 0.74, s: 0.86, o: 0.55, z: 2 },
          { x: 1.3,  s: 0.74, o: 0.25, z: 1 }
        ];
        function enhance(track) {
          if (track.dataset.wk) return;
          track.dataset.wk = '1';
          var items = Array.prototype.slice.call(track.children);
          if (items.length < 2) return;
          var wrap = track.parentElement;
          wrap.classList.add('wk-carousel');
          var stage = document.createElement('div');
          stage.className = 'wk-stage';
          track.parentElement.insertBefore(stage, track);
          items.forEach(function (it) { stage.appendChild(it); });
          track.remove();
          var active = 0;
          var dots = document.createElement('div');
          dots.className = 'wk-dots';
          items.forEach(function (_, i) {
            var d = document.createElement('button');
            d.type = 'button'; d.setAttribute('aria-label', (i + 1) + '번째 프로젝트');
            d.addEventListener('click', function () { go(i); });
            dots.appendChild(d);
          });
          function btn(cls, label, path) {
            var b = document.createElement('button');
            b.type = 'button'; b.className = 'wk-carousel-btn ' + cls; b.setAttribute('aria-label', label);
            b.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="' + path + '" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            return b;
          }
          var prev = btn('wk-carousel-btn--prev', '이전 프로젝트', 'M15 5l-7 7 7 7');
          var next = btn('wk-carousel-btn--next', '다음 프로젝트', 'M9 5l7 7-7 7');
          prev.addEventListener('click', function () { go(active - 1); });
          next.addEventListener('click', function () { go(active + 1); });
          stage.after(dots); stage.after(next); stage.after(prev);
          stage.classList.add('wk-stage--ready');
          function measure() {
            var h = 0;
            items.forEach(function (it) { h = Math.max(h, it.offsetHeight); });
            stage.style.height = h + 'px';
          }
          function layout() {
            var unit = Math.min(230, window.innerWidth * 0.2);
            items.forEach(function (it, i) {
              var d = i - active;
              var ad = Math.abs(d);
              var pos = POS[Math.min(ad, 2)];
              var x = d === 0 ? 0 : Math.sign(d) * (ad === 1 ? unit : unit * 1.75);
              it.style.transform = 'translateX(-50%) translateX(' + x + 'px) scale(' + pos.s + ')';
              it.style.opacity = ad > 2 ? '0' : String(pos.o);
              it.style.zIndex = String(pos.z);
              it.style.pointerEvents = ad > 2 ? 'none' : 'auto';
              it.style.filter = ad === 0 ? 'none' : 'saturate(0.7)';
              it.setAttribute('aria-hidden', ad > 2 ? 'true' : 'false');
            });
            prev.disabled = active === 0;
            next.disabled = active === items.length - 1;
            [].forEach.call(dots.children, function (d, i) { d.setAttribute('aria-current', i === active ? 'true' : 'false'); });
            measure();
          }
          function go(i) {
            active = Math.max(0, Math.min(items.length - 1, i));
            layout();
          }
          // 옆 카드를 누르면 그 카드를 가운데로
          items.forEach(function (it, i) {
            it.addEventListener('click', function (e) {
              if (i !== active) { e.preventDefault(); e.stopPropagation(); go(i); }
            }, true);
          });
          // 마우스·터치 드래그
          var sx = 0, dragging = false, moved = false;
          stage.addEventListener('pointerdown', function (e) { dragging = true; moved = false; sx = e.clientX; });
          window.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - sx;
            if (!moved && Math.abs(dx) > 8) { moved = true; stage.classList.add('is-dragging'); }
          });
          window.addEventListener('pointerup', function (e) {
            if (!dragging) return;
            dragging = false;
            stage.classList.remove('is-dragging');
            var dx = e.clientX - sx;
            if (moved && Math.abs(dx) > 50) go(active + (dx < 0 ? 1 : -1));
            if (moved) { stage.dataset.drag = '1'; setTimeout(function () { delete stage.dataset.drag; }, 0); }
          });
          stage.addEventListener('click', function (e) { if (stage.dataset.drag) { e.preventDefault(); e.stopPropagation(); } }, true);
          window.addEventListener('resize', layout);
          layout();
        }
        function scan() {
          var work = document.getElementById('work');
          if (!work) return false;
          var tracks = work.querySelectorAll('.snap-x');
          tracks.forEach(enhance);
          return tracks.length > 0;
        }
        var t = setInterval(function () { if (scan()) clearInterval(t); }, 150);
        setTimeout(function () { clearInterval(t); }, 8000);
      })();
    </script>
    <style id="capture-strip">
      /* 상세 캡처: 화면 캡처를 가로 필름스트립으로 놓고 드래그·스와이프로 넘긴다 */
      .cap-strip {
        display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important;
        align-items: flex-start !important; gap: 23px !important;
        overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
        padding: 8px 120px 24px !important; box-sizing: border-box;
        scrollbar-width: none; cursor: grab; -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
      }
      .cap-strip::-webkit-scrollbar { display: none; }
      .cap-strip > * { flex: 0 0 240px !important; width: 240px !important; min-width: 0 !important; scroll-snap-align: start; }
      .cap-strip img { pointer-events: none; -webkit-user-drag: none; user-select: none; }
      .cap-strip.is-dragging { cursor: grabbing; scroll-snap-type: none; }
      .cap-strip.is-dragging * { pointer-events: none; }
      @media (max-width: 640px) {
        .cap-strip { padding: 8px 20px 20px !important; gap: 14px !important; }
        .cap-strip > * { flex: 0 0 190px !important; width: 190px !important; }
      }
    </style>
    <script>
      (function () {
        function enhance(container) {
          if (container.dataset.capStrip) return;
          container.dataset.capStrip = '1';
          container.classList.add('cap-strip');
          var sx = 0, sl = 0, down = false, moved = false;
          container.addEventListener('pointerdown', function (e) {
            if (e.pointerType !== 'mouse') return;
            down = true; moved = false; sx = e.clientX; sl = container.scrollLeft;
          });
          window.addEventListener('pointermove', function (e) {
            if (!down) return;
            var dx = e.clientX - sx;
            if (!moved && Math.abs(dx) > 5) { moved = true; container.classList.add('is-dragging'); }
            if (moved) container.scrollLeft = sl - dx;
          });
          window.addEventListener('pointerup', function () {
            if (!down) return;
            down = false;
            if (moved) {
              container.classList.remove('is-dragging');
              container.dataset.drag = '1';
              setTimeout(function () { delete container.dataset.drag; }, 0);
            }
          });
          container.addEventListener('click', function (e) {
            if (container.dataset.drag) { e.preventDefault(); e.stopPropagation(); }
          }, true);
        }
        function scan() {
          var anchors = document.querySelectorAll('a[href] img[src*="captures/"]');
          anchors.forEach(function (img) {
            var a = img.closest('a');
            // 캡처 한 장이 들어 있는 칸(열)의 부모가 그 칸들을 모은 그룹 컨테이너
            var col = a && a.parentElement;
            var group = col && col.parentElement;
            if (!group) return;
            var caps = Array.prototype.filter.call(group.children, function (c) { return c.querySelector('img[src*="captures/"]'); });
            if (caps.length >= 2 && !group.dataset.capStrip) enhance(group);
          });
        }
        var t = setInterval(scan, 300);
        window.addEventListener('hashchange', scan);
        setTimeout(function () { clearInterval(t); }, 20000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var ID = "wireflow-embed";
        // 홈 화면에서만 보이도록 한다 (#/project/... 상세 화면에서는 숨김)
        function onHome() {
          return !/^#\/project\//.test(window.location.hash);
        }
        function sync() {
          var el = document.getElementById(ID);
          if (el) el.style.display = onHome() ? "" : "none";
        }
        function inject() {
          var target = document.getElementById("components");
          if (!target || !target.parentNode) return;
          if (document.getElementById(ID)) return;
          var sec = document.createElement("section");
          sec.id = ID;
          sec.style.cssText = "padding:48px 0;background:#fff";
          sec.innerHTML =
            '<div style="width:min(1140px,calc(100% - 32px));margin:0 auto">' +
            '<iframe src="design/portfolio-redesign.html" title="포트폴리오 메인·상세 와이어플로" loading="lazy" style="width:100%;height:720px;border:1px solid #e5e5ea;border-radius:12px;background:#fff"></iframe>' +
            "</div>";
          target.parentNode.insertBefore(sec, target);
        }
        function update() {
          inject();
          sync();
        }
        update();
        window.addEventListener("hashchange", update);
        var mo = new MutationObserver(update);
        mo.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
