<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>장바구니 | SAMPLE MUSIC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/shop.css" />
</head>
<body>
  <div class="topbar"><div class="wrap"><a href="#">로그인</a><a href="#">회원가입</a><a class="on" href="cart.html">장바구니</a><a href="#">주문조회</a></div></div>
  <header class="header"><div class="wrap">
    <a class="logo" href="index.html">SAMPLE MUSIC</a>
    <nav class="gnb"><a href="index.html">홈</a><a href="list.html">전체상품</a><a href="list.html?cat=string">현악기</a><a href="list.html?cat=keys">건반악기</a><a href="list.html?cat=acc">악기 용품</a></nav>
    <div class="util"><form class="search" action="search.html" role="search"><input type="search" name="q" placeholder="상품 검색" aria-label="상품 검색" /><button type="submit" aria-label="검색">검색</button></form><a class="cart-link" href="cart.html">장바구니 <span class="cart-count">0</span></a></div>
  </div></header>

  <main class="wrap">
    <div class="page-title"><h1>장바구니</h1><p>담은 상품을 확인하고 수량을 바꿔 보세요.</p></div>
    <div class="cart-layout">
      <div class="cart-list">
        <div class="cart-head"><span id="cart-head-note"></span><button class="link-btn" id="cart-clear" type="button">전체 비우기</button></div>
        <div id="cart-items"></div>
      </div>
      <aside class="cart-summary" id="cart-summary" hidden>
        <h2>주문 예상 금액</h2>
        <div class="sum-row"><span>상품 금액</span><b id="sum-goods"></b></div>
        <div class="sum-row"><span>배송비</span><b id="sum-ship"></b></div>
        <p class="sum-note" id="sum-free-note"></p>
        <div class="sum-row total"><span>합계</span><b id="sum-total"></b></div>
        <button class="buy-main" id="cart-order" type="button">주문하기</button>
        <p class="sum-note">이 페이지는 샘플이라 실제 주문은 진행되지 않습니다.</p>
      </aside>
    </div>
  </main>

  <footer style="margin-top:48px"><div class="wrap">
    <p><b>SAMPLE MUSIC</b> (포트폴리오용 예시 악기 쇼핑몰)</p>
    <p>이 페이지는 Cafe24 쇼핑몰 구조를 참고해 직접 구성한 악기 샘플이며, 실제 판매처와 무관합니다.</p>
  </div></footer>
  <div class="toast" id="toast"></div>
  <script src="js/data.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
